name: Publish to Maven & Create GitHub Release

on:
  push:
    branches:
      - version/**
  workflow_dispatch:

jobs:
  build:
    uses: SLNE-Development/surf-workflows/.github/workflows/build-publish-release-gradle.yml@master
    with:
      modules: "surf-player-paper-*-all.jar;surf-player-minestom-*-all.jar;surf-player-velocity-*-all.jar;surf-player-placeholder-expansion-*-all.jar;surf-player-microservice-*-all.jar"
    secrets: inherit
