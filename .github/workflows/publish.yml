name: Publish to Maven & Create GitHub Release

on:
  push:
    branches:
      - version/**
  workflow_dispatch:

jobs:
  build:
    uses: SLNE-Development/surf-workflows/.github/workflows/build-publish-release-gradle.yml@master
    with:
      modules: "surf-social-paper-*-all.jar;surf-social-minestom-*-all.jar;surf-social-velocity-*-all.jar;surf-social-placeholder-expansion-*-all.jar;surf-social-microservice-*-all.jar"
    secrets: inherit
